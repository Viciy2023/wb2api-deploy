name: Sync & Build workbuddy2api

on:
  schedule:
    # 每 4 小时一次；UTC 00/04/08/12/16/20 = 北京 08/12/16/20/24/04 点
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

env:
  UPSTREAM_REPO: Sliverkiss/workbuddy2api
  UPSTREAM_BRANCH: master
  IMAGE_NAME: ghcr.io/viciy2023/wb2api-deploy
  # 构建修订号：仅当下游构建逻辑变化时递增。
  # 它参与 last-build.txt 的指纹比对，改这里即可强制重建一次。
  # v3: 不再补丁 Dockerfile，直接使用上游已修复的版本。
  BUILD_REV: v3

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream README
        run: |
          gh api repos/${{ env.UPSTREAM_REPO }}/contents/README.md \
            --jq '.content' | base64 -d > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README unchanged."
          else
            git commit -m "docs: sync upstream README"
            git pull --rebase origin main
            git push
            echo "README synced."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream latest SHA
        id: compare
        run: |
          UPSTREAM_SHA=$(gh api repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_BRANCH }} --jq '.sha')
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          # last-build.txt 格式：<upstream_sha><build_rev>（旧格式只有 sha，会被视为变化并补建一次）
          LAST_LINE=$(cat last-build.txt 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "last_fp=$LAST_LINE"
          WANT_FP="${UPSTREAM_SHA}${BUILD_REV}"
          echo "want_fp=$WANT_FP  last_fp=$LAST_LINE"
          if [ "$WANT_FP" = "$LAST_LINE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change detected (upstream ${UPSTREAM_SHA} + ${BUILD_REV}), skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Change detected: ${LAST_LINE:-<empty>} -> $WANT_FP"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch ${{ env.UPSTREAM_BRANCH }} https://github.com/${{ env.UPSTREAM_REPO }}.git upstream

      - name: Prepare build config
        run: |
          if [ ! -f upstream/config.json ]; then
            cp upstream/config.example.json upstream/config.json
            echo "Created config.json from config.example.json (build-time placeholder)"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.check.outputs.upstream_sha }}

      - name: Record built fingerprint
        run: |
          echo "${{ needs.check.outputs.upstream_sha }}${BUILD_REV}" > last-build.txt

      - name: Commit last-build.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build.txt
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "build: ${{ needs.check.outputs.upstream_sha }} ${BUILD_REV}"
            git pull --rebase origin main
            git push
          fi
