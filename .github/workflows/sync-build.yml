name: Sync & Build workbuddy2api

# 从上游 clone 源码后自己构建，推送两个 registry：
#   ghcr.io/viciy2023/wb2api-deploy   —— GHCR，备用通道
#   ccy2026/workbuddy2api             —— Docker Hub，飞牛实际拉取的那条
#
# 为什么需要 Docker Hub：飞牛配的 registry-mirrors 都是 Docker Hub 的 mirror，
# 按 Docker 的设计只对 docker.io 生效，对 ghcr.io 无效。推到 Docker Hub 才能
# 走国内加速源。
#
# 命名跟惯例对齐：<用户名>/<镜像名>:<标签>，一个服务占一个仓库。

on:
  schedule:
    # 每 4 小时一次；UTC 00/04/08/12/16/20 = 北京 08/12/16/20/00/04 点
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

env:
  # 上游原为 Sliverkiss/workbuddy2api（已删库，API 返回 404），改用其延续仓库。
  UPSTREAM_REPO: HanawaBanana/workbuddy2api
  UPSTREAM_BRANCH: master
  IMAGE_NAME: ghcr.io/viciy2023/wb2api-deploy
  # Docker Hub 上的仓库名。完整镜像名是 <DOCKERHUB_USERNAME>/workbuddy2api。
  # 未配置 Docker Hub 凭据时会自动跳过，只推 GHCR。
  DOCKERHUB_REPO: workbuddy2api
  # 构建修订号：仅当下游构建逻辑变化时递增。
  # 它参与 last-build.txt 的指纹比对，改这里即可强制重建一次。
  # v3: 不再补丁 Dockerfile，直接使用上游已修复的版本。
  BUILD_REV: v4
  # 递增说明：构建产物增加了 Docker Hub 目标（ccy2026/wb2api）。

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream README
        run: |
          gh api repos/${{ env.UPSTREAM_REPO }}/contents/README.md \
            --jq '.content' | base64 -d > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README unchanged."
          else
            git commit -m "docs: sync upstream README"
            git pull --rebase origin main
            git push
            echo "README synced."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream latest SHA
        id: compare
        run: |
          UPSTREAM_SHA=$(gh api repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.UPSTREAM_BRANCH }} --jq '.sha')
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          # last-build.txt 格式：<upstream_sha><build_rev>（旧格式只有 sha，会被视为变化并补建一次）
          LAST_LINE=$(cat last-build.txt 2>/dev/null | tr -d '[:space:]' || echo "")
          echo "last_fp=$LAST_LINE"
          WANT_FP="${UPSTREAM_SHA}${BUILD_REV}"
          echo "want_fp=$WANT_FP  last_fp=$LAST_LINE"
          if [ "$WANT_FP" = "$LAST_LINE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change detected (upstream ${UPSTREAM_SHA} + ${BUILD_REV}), skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Change detected: ${LAST_LINE:-<empty>} -> $WANT_FP"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch ${{ env.UPSTREAM_BRANCH }} https://github.com/${{ env.UPSTREAM_REPO }}.git upstream

      - name: Prepare build config
        run: |
          if [ ! -f upstream/config.json ]; then
            cp upstream/config.example.json upstream/config.json
            echo "Created config.json from config.example.json (build-time placeholder)"
          fi

      # 先算出要推的标签：Docker Hub 凭据没配时就不含它，避免登录失败把构建拖垮。
      - name: 组装推送目标
        id: tags
        run: |
          SHA="${{ needs.check.outputs.upstream_sha }}"
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${SHA}"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DEST="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPO}"
            TAGS="${TAGS},${DEST}:latest,${DEST}:${SHA}"
            echo "hub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 凭据已配置，将同时推送 ${DEST}。"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
            echo "未配置 Docker Hub 凭据，本次只推送 GHCR。"
          fi
          echo "value=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.tags.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          push: true
          tags: ${{ steps.tags.outputs.value }}

      - name: Record built fingerprint
        run: |
          echo "${{ needs.check.outputs.upstream_sha }}${BUILD_REV}" > last-build.txt

      - name: Commit last-build.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build.txt
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "build: ${{ needs.check.outputs.upstream_sha }} ${BUILD_REV}"
            git pull --rebase origin main
            git push
          fi
